name: Verify SMTP test on all platforms

on:
  push:
    branches: [verify/offline-smtp-platforms]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: test_smtp
        shell: bash
        run: python -m pytest -v -p no:cacheprovider tests/plugins_tests/openssl_cipher_suites/test_openssl_cipher_suites_plugin.py -k smtp --durations=1
      - name: SMTP stub reject paths and shutdown() probe
        shell: bash
        run: python verify/smtp_platform_checks.py
